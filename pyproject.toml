[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

# The package aiyagari1994qje (in src/) is the computation of AiyagariMarkovHARK.ipynb.
# Other projects install it from git; its dependencies are ranges so that it fits their
# environments. uv.lock pins every version for this repository's own runs.
[project]
name = "aiyagari1994qje"
version = "1.1.0"
description = "Aiyagari (1994): uninsured idiosyncratic risk and aggregate saving, solved with HARK"
authors = [{ name = "Adam Edwards", email = "edwardsadam01@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "econ-ark>=0.17,<0.18",
    "matplotlib",
    "numpy>=2",
    "scipy",
    "sympy",  # econ-ark 0.17 imports sympy without declaring it
]

[dependency-groups]
# What the notebooks need beyond the package; setup_envs.sh installs it into .venv-hark
notebook = [
    "ipykernel",
    "jupyterlab",
    "nbconvert",
    "pandas",
]

[tool.uv]
default-groups = ["notebook"]
