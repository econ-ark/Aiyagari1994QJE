# The Aiyagari (1994) economy for dolo and DolARK.
#
# The first document is the household's problem, the second the economy that closes it. The notebook
# AiyagariDolARK.ipynb reads this file, puts in each Table II cell's income chain and parameters, and
# solves the economy; see the notebook for what each part means.
#
# What changed in version 2.0, each of which moved Table II (the notebook says by how much):
#   - the Euler equation is the CRRA one, 1 - β(1+r') (c'/c)^(-θ). Until then it was written
#     1 - (β(1+r'))^(1/θ) c/c', which is the same equation only when θ = 1;
#   - the income process is Aiyagari's own seven-state Tauchen chain, written out below for the baseline
#     (σ = 0.2, ρ = 0.6). Until then it was a VAR1, which dolo turns into a three-state Rouwenhorst chain;
#   - the household's rule is solved on a grid that is dense near the borrowing limit, with linear
#     interpolation, where it was 75 evenly spaced points up to 300 with cubic interpolation. The
#     population is no longer computed on this grid at all: the notebook computes it on a grid of its
#     own, with the code that computes HARK's.

name: Consumption Savings

symbols:
    states: [a]
    exogenous: [r, w, e]
    parameters: [β, B, θ, a_max]
    controls: [i]

definitions: |
    c[t] = (1+r[t])*a[t] + w[t]*exp(e[t]) - i[t]

equations:
    arbitrage: |
        1 - β*(1+r[t+1])*(c[t+1]/c[t])^(-θ) ⟂ -B <= i[t] <= (1+r[t])*a[t]+w[t]*exp(e[t])
    transition: |
        a[t] = i[t-1]

calibration:
    β: 0.96
    B: 1e-10
    a_max: 150.
    a: 0
    i: 0  # the rule time iteration starts from: save nothing, so consumption is positive everywhere
    K: 6
    α: 0.36
    θ: 3
    L: 1.0227242846146125
    δ: 0.08
    r: α*(L/K[t])^(1-α) - δ
    w: (1-α)*(K[t]/L)^(α)

domain:
    a: [-B, a_max]

exogenous:
    r, w: !ConstantProcess
        μ: [r, w]

    # Aiyagari's income process at the baseline: log labor endowment in each state, and the
    # probability of each state next year from each state this year (Tauchen's method, 7 states,
    # the outermost 3 unconditional standard deviations out)
    e: !MarkovChain
        values: [[-0.6000000000000001], [-0.4], [-0.2], [0.0], [0.20000000000000007], [0.40000000000000013], [0.6000000000000001]]
        transitions: [
            [0.19078695285251068, 0.45538281382021306, 0.3017489539120567, 0.05006114192527356, 0.0020016007520997996, 1.8498446505144095e-05, 3.829134109789578e-08],
            [0.05208127941521956, 0.3017489539120566, 0.4553828138202132, 0.1739936464040619, 0.01642422799417376, 0.00036720546226951087, 1.8729920056026472e-06],
            [0.008774475095738369, 0.12152004204107048, 0.419443707693304, 0.36569605281855155, 0.08023327398832314, 0.004279136013261464, 5.3312349751144517e-05],
            [0.0008890252991084335, 0.029507336466152993, 0.23558916728343912, 0.46802894190259886, 0.2355891672834391, 0.029507336466152993, 0.0008890252991084319],
            [5.33123497511445e-05, 0.004279136013261463, 0.08023327398832313, 0.3656960528185514, 0.419443707693304, 0.12152004204107045, 0.008774475095738364],
            [1.8729920056026472e-06, 0.00036720546226950946, 0.016424227994173757, 0.17399364640406179, 0.4553828138202133, 0.3017489539120566, 0.05208127941521956],
