---

name: Aiyagari

symbols:
    exogenous: [z]
    aggregate: [K]
    parameters: [α, δ, L]

calibration:
    α: 0.36
    δ: 0.08
    L: 1.0227242846146125
    K: 6
    z: 0

exogenous: !ConstantProcess
    μ: [z]

projection: |
    r[t] = α*(L/K[t])^(1-α) - δ
    w[t] = (1-α)*(K[t]/L)^(α)

equilibrium: |
    K[t] = a[t]
